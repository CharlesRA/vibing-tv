<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>vibing-tv</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%235e6ad2'/%3E%3Cpath d='M4.5 5l3 3-3 3M8.5 11h3' stroke='white' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <aside class="sidebar">
      <div class="workspace">
        <span class="logo" aria-hidden="true"></span>
        <select id="session" aria-label="Claude Code session" title="Claude Code session (S)"></select>
      </div>
      <h2 class="section">Files</h2>
      <ul id="files" class="files"></ul>
      <footer class="sidebar-foot">
        <span id="status" class="status" title="Connection to the server">Connecting</span>
        <span class="tally"><span id="counter"></span><span id="queued" class="queued"></span></span>
      </footer>
    </aside>

    <main class="main">
      <header class="main-head">
        <nav id="crumb" class="crumb" aria-label="Current file"></nav>
        <div class="controls">
          <button id="pause" class="icon-btn" type="button"></button>
          <button
            id="skip"
            class="icon-btn"
            type="button"
            aria-label="Skip"
            title="Skip to the end of this edit (→)"
          ></button>
          <label class="speed" title="Typing speed">
            <span class="visually-hidden">Typing speed</span>
            <input id="speed" type="range" min="1" max="12" value="3" />
          </label>
        </div>
      </header>
      <div id="tabs" class="tabs"></div>
      <div id="banner" class="banner" hidden></div>
      <section class="editor-area">
        <div id="editor" class="editor"></div>
        <div id="empty" class="empty">Waiting for Claude's first edit…</div>
      </section>
    </main>

    <aside class="side">
      <section id="steps" class="steps" hidden>
        <h2 class="section">Steps <span id="steps-count" class="steps-count"></span></h2>
        <ol id="steps-list" class="steps-list"></ol>
      </section>
      <h2 class="section">Activity</h2>
      <div id="feed" class="feed"></div>
    </aside>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
