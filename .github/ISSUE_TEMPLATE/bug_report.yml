name: Bug report
description: Something in vibing-tv does not work as described.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Start Claude Code with …\n2. Ask Claude to …\n3. Open the viewer …"
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "Output of `claude --version`, `node --version`, and `curl -s http://127.0.0.1:4317/health`"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Linux, Windows]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Server log
      description: The last lines of `~/.vibing-tv/server.log`, if relevant. Remove anything private.
      render: text
